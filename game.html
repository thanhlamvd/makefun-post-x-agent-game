<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SNAKE — one prompt, one game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #07070f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; pointer-events: none;
    color: #e8e8f2; text-shadow: 0 0 12px rgba(57,255,136,.6);
    font-size: 22px; letter-spacing: 2px;
  }
  #hud .title { color: #39ff88; font-weight: bold; }
  #hud .score { color: #ff2d95; font-weight: bold; }
  #hud .dim { color: #8a8aa3; font-size: 16px; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #e8e8f2; background: rgba(7,7,15,.72); pointer-events: none;
  }
  #overlay h1 { font-size: 64px; letter-spacing: 6px; color: #39ff88;
    text-shadow: 0 0 24px rgba(57,255,136,.9), 0 0 64px rgba(57,255,136,.5); }
  #overlay h2 { font-size: 28px; color: #ff2d95; letter-spacing: 3px; margin-top: 12px;
    text-shadow: 0 0 18px rgba(255,45,149,.8); }
  #overlay p { font-size: 20px; color: #b9b9d1; margin-top: 22px; line-height: 1.7; }
  #overlay .big { font-size: 30px; color: #ffd166; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <span class="title">NEON SNAKE</span>
    <span class="dim">ARROWS / WASD — STEER &nbsp;·&nbsp; R — RESTART &nbsp;·&nbsp; D — AUTOPILOT</span>
    <span>SCORE <span class="score" id="score">0</span></span>
  </div>
  <div id="overlay">
    <h1>NEON SNAKE</h1>
    <h2>EAT THE ORBS · DON'T BITE YOURSELF</h2>
    <p>PRESS AN ARROW KEY OR CLICK TO START</p>
  </div>
</div>
<script>
"use strict";
/* NEON SNAKE — built from one prompt:
   "Build me a tiny browser game: a neon snake that eats glowing orbs —
    arrow keys to steer, score counter, game over, press R to restart. Make it juicy." */

const COLS = 48, ROWS = 27, CELL = 20;      // logical grid, 960 x 540
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;
const scoreEl = document.getElementById("score");
const overlay = document.getElementById("overlay");

const params = new URLSearchParams(location.search);
let snake, dir, pendingDir, orb, bonusOrb, particles, score, eaten, speed, alive, started, demo, lastStep, shake;

function reset() {
  snake = [{ x: 10, y: 13 }, { x: 9, y: 13 }, { x: 8, y: 13 }];
  dir = { x: 1, y: 0 };
  pendingDir = dir;
  score = 0; eaten = 0; speed = 8; alive = true; started = false;
  particles = []; shake = 0;
  orb = spawnOrb(false);
  bonusOrb = null;
  lastStep = performance.now();
  scoreEl.textContent = "0";
  showStart();
}

function spawnOrb(bonus) {
  for (let tries = 0; tries < 500; tries++) {
    const p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    if (!snake.some(s => s.x === p.x && s.y === p.y) &&
        !(orb && orb.x === p.x && orb.y === p.y)) return p;
  }
  return { x: 0, y: 0 };
}

function showStart() {
  overlay.classList.remove("hidden");
  overlay.innerHTML = '<h1>NEON SNAKE</h1><h2>EAT THE ORBS · DON\'T BITE YOURSELF</h2>' +
    '<p>PRESS AN ARROW KEY OR CLICK TO START</p>';
}
function showGameOver() {
  overlay.classList.remove("hidden");
  overlay.innerHTML = '<h1 style="color:#ff2d95;text-shadow:0 0 24px rgba(255,45,149,.9)">GAME OVER</h1>' +
    '<p class="big">SCORE ' + score + ' · LENGTH ' + snake.length + '</p>' +
    '<p>PRESS R TO RESTART</p>';
}
function hideOverlay() { overlay.classList.add("hidden"); }

function setDir(x, y) {
  if (!started && alive) { started = true; hideOverlay(); }
  if (dir.x === -x && dir.y === -y) return;           // no reversing
  if (dir.x === x && dir.y === y) return;
  pendingDir = { x, y };
}

function step(now) {
  if (!alive) return;
  if (demo) autoPilot();
  dir = pendingDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    burst(snake[0].x, snake[0].y, "#ff2d95", 26);
    shake = 14;
    showGameOver();
    if (demo) setTimeout(() => { reset(); started = true; hideOverlay(); }, 1500);
    return;
  }
  snake.unshift(head);
  let ate = false;
  if (head.x === orb.x && head.y === orb.y) {
    ate = true;
    score += 10; eaten++;
    burst(orb.x, orb.y, "#ff2d95", 14);
    orb = spawnOrb(false);
    if (eaten % 5 === 0) bonusOrb = spawnOrb(true);
    speed = Math.min(16, 8 + eaten * 0.35);
  } else if (bonusOrb && head.x === bonusOrb.x && head.y === bonusOrb.y) {
    ate = true;
    score += 50; eaten++;
    burst(bonusOrb.x, bonusOrb.y, "#ffd166", 22);
    bonusOrb = null;
    speed = Math.min(16, 8 + eaten * 0.35);
  }
  if (!ate) snake.pop();
  scoreEl.textContent = String(score);
}

/* Demo autopilot: greedy toward the orb, never into a wall or the body. */
function autoPilot() {
  const head = snake[0];
  const target = bonusOrb || orb;
  const moves = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  const safe = moves.filter(m => {
    if (dir.x === -m.x && dir.y === -m.y) return false;
    const nx = head.x + m.x, ny = head.y + m.y;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return false;
    const body = snake.slice(0, -1);                 // tail moves away
    return !body.some(s => s.x === nx && s.y === ny);
  });
  if (!safe.length) return;
  safe.sort((a, b) => {
    const da = Math.abs(head.x + a.x - target.x) + Math.abs(head.y + a.y - target.y);
    const db = Math.abs(head.x + b.x - target.x) + Math.abs(head.y + b.y - target.y);
    return da - db;
  });
  pendingDir = safe[0];
}

function burst(cx, cy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3.5;
    particles.push({ x: cx * CELL + CELL / 2, y: cy * CELL + CELL / 2,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color });
  }
}

function draw(now) {
  ctx.save();
  if (shake > 0.5) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.88; }
  ctx.fillStyle = "#07070f";
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
  ctx.strokeStyle = "rgba(255,255,255,0.045)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); }
  ctx.stroke();

  const pulse = 0.65 + 0.35 * Math.sin(now / 220);
  drawOrb(orb, "#ff2d95", pulse);
  if (bonusOrb) drawOrb(bonusOrb, "#ffd166", pulse);

  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const t = i / Math.max(1, snake.length - 1);
    const r = i === 0 ? 34 : 190 - t * 140;
    const g = i === 0 ? 255 : 255 - t * 120;
    const b = i === 0 ? 136 : 136 + t * 110;
    ctx.fillStyle = "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
    ctx.shadowColor = i === 0 ? "#39ff88" : "#22d3ee";
    ctx.shadowBlur = i === 0 ? 22 : 12;
    const pad = i === 0 ? 1 : 3;
    ctx.beginPath();
    ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOrb(o, color, pulse) {
  const cx = o.x * CELL + CELL / 2, cy = o.y * CELL + CELL / 2;
  ctx.shadowColor = color; ctx.shadowBlur = 18 * pulse;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, 6 + 2 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 2, 0, Math.PI * 2); ctx.fill();
}

function frame(now) {
  if (alive && started && now - lastStep > 1000 / speed) { step(now); lastStep = now; }
  draw(now);
  requestAnimationFrame(frame);
}

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "w") { setDir(0, -1); e.preventDefault(); }
  else if (k === "arrowdown" || k === "s") { setDir(0, 1); e.preventDefault(); }
  else if (k === "arrowleft" || k === "a") { setDir(-1, 0); e.preventDefault(); }
  else if (k === "arrowright" || k === "d" && !e.shiftKey) { setDir(1, 0); e.preventDefault(); }
  else if (k === "r") { reset(); started = true; hideOverlay(); }
  else if (k === "d" && e.shiftKey) { demo = !demo; }
  else if (k === " ") { if (!started && alive) { started = true; hideOverlay(); } e.preventDefault(); }
});
canvas.addEventListener("click", () => { if (!started && alive) { started = true; hideOverlay(); } });

/* Test hook: live state for automated checks. */
window.__game = {
  state: () => ({ score, eaten, length: snake.length, alive, started, demo,
                  head: snake[0], orb, speed }),
  startDemo: () => { demo = true; started = true; hideOverlay(); },
  stopDemo: () => { demo = false; }
};

demo = params.get("demo") === "1";
reset();
if (demo) { started = true; hideOverlay(); }
requestAnimationFrame(frame);
</script>
</body>
</html>
